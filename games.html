<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - NEXUS Platform</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-canvas {
            width: 100%;
            height: 400px;
            background: #000;
            border-radius: 10px;
        }
        .game-controls {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .score-board {
            text-align: center;
            margin: 1rem;
            font-size: 1.5rem;
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="content">
        <nav class="navbar">
            <div class="logo">NEXUS<span>.games</span></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="ecommerce.html">Shop</a>
                <a href="games.html">Games</a>
            </div>
        </nav>
        
        <h2 class="section-title">🎮 Arcade Games</h2>
        
        <div class="games-grid">
            <div class="game-card" onclick="playGame('snake')">
                <div class="feature-icon">🐍</div>
                <h3>Snake Game</h3>
                <p>Classic snake game. Eat food and grow!</p>
            </div>
            <div class="game-card" onclick="playGame('pong')">
                <div class="feature-icon">🏓</div>
                <h3>Pong</h3>
                <p>Classic arcade ping pong</p>
            </div>
            <div class="game-card" onclick="playGame('memory')">
                <div class="feature-icon">🧠</div>
                <h3>Memory Match</h3>
                <p>Test your memory skills</p>
            </div>
        </div>
        
        <div id="game-container" style="display: none; padding: 2rem;">
            <div class="score-board">Score: <span id="score">0</span></div>
            <canvas id="game-canvas" class="game-canvas" width="800" height="400"></canvas>
            <div class="game-controls">
                <button onclick="closeGame()">Close Game</button>
                <button onclick="restartGame()">Restart</button>
            </div>
        </div>
    </div>
    
    <script src="firebase-config.js"></script>
    <script>
        let currentGame = null;
        
        function playGame(gameType) {
            document.getElementById('game-container').style.display = 'block';
            document.querySelector('.games-grid').style.display = 'none';
            
            switch(gameType) {
                case 'snake':
                    startSnakeGame();
                    break;
                case 'pong':
                    startPongGame();
                    break;
                case 'memory':
                    startMemoryGame();
                    break;
            }
        }
        
        function startSnakeGame() {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            let snake = [{x: 10, y: 10}];
            let direction = 'RIGHT';
            let food = {x: 15, y: 15};
            let score = 0;
            
            function draw() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw snake
                ctx.fillStyle = '#00ff88';
                snake.forEach(segment => {
                    ctx.fillRect(segment.x * 20, segment.y * 20, 18, 18);
                });
                
                // Draw food
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(food.x * 20, food.y * 20, 18, 18);
            }
            
            function update() {
                let newHead = {...snake[0]};
                switch(direction) {
                    case 'RIGHT': newHead.x++; break;
                    case 'LEFT': newHead.x--; break;
                    case 'UP': newHead.y--; break;
                    case 'DOWN': newHead.y++; break;
                }
                
                snake.unshift(newHead);
                if(newHead.x === food.x && newHead.y === food.y) {
                    score += 10;
                    document.getElementById('score').innerText = score;
                    food = {
                        x: Math.floor(Math.random() * 40),
                        y: Math.floor(Math.random() * 20)
                    };
                } else {
                    snake.pop();
                }
                
                // Check collision
                if(newHead.x < 0 || newHead.x > 39 || newHead.y < 0 || newHead.y > 19 || 
                   snake.slice(1).some(s => s.x === newHead.x && s.y === newHead.y)) {
                    alert('Game Over! Score: ' + score);
                    closeGame();
                }
            }
            
            document.addEventListener('keydown', (e) => {
                if(e.key === 'ArrowRight') direction = 'RIGHT';
                if(e.key === 'ArrowLeft') direction = 'LEFT';
                if(e.key === 'ArrowUp') direction = 'UP';
                if(e.key === 'ArrowDown') direction = 'DOWN';
            });
            
            currentGame = setInterval(() => {
                update();
                draw();
            }, 100);
        }
        
        function startPongGame() {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            let paddleY = canvas.height/2 - 50;
            let computerY = canvas.height/2 - 50;
            let ballX = canvas.width/2, ballY = canvas.height/2;
            let ballSpeedX = 3, ballSpeedY = 3;
            let playerScore = 0, computerScore = 0;
            
            canvas.addEventListener('mousemove', (e) => {
                let rect = canvas.getBoundingClientRect();
                paddleY = e.clientY - rect.top - 50;
                if(paddleY < 0) paddleY = 0;
                if(paddleY > canvas.height - 100) paddleY = canvas.height - 100;
            });
            
            function draw() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#fff';
                ctx.fillRect(10, paddleY, 10, 100);
                ctx.fillRect(canvas.width - 20, computerY, 10, 100);
                ctx.fillRect(ballX, ballY, 10, 10);
                
                ctx.font = '20px Arial';
                ctx.fillText(playerScore, canvas.width/4, 30);
                ctx.fillText(computerScore, 3*canvas.width/4, 30);
            }
            
            function update() {
                ballX += ballSpeedX;
                ballY += ballSpeedY;
                
                if(ballY < 0 || ballY > canvas.height - 10) ballSpeedY = -ballSpeedY;
                
                computerY += (ballY - computerY - 50) * 0.05;
                
                if(ballX < 20 && ballX > 10 && ballY > paddleY && ballY < paddleY + 100) {
                    ballSpeedX = -ballSpeedX;
                }
                if(ballX > canvas.width - 30 && ballX < canvas.width - 10 && ballY > computerY && ballY < computerY + 100) {
                    ballSpeedX = -ballSpeedX;
                }
                
                if(ballX < 0) {
                    computerScore++;
                    resetBall();
                }
                if(ballX > canvas.width) {
                    playerScore++;
                    resetBall();
                }
                
                document.getElementById('score').innerText = `${playerScore} - ${computerScore}`;
            }
            
            function resetBall() {
                ballX = canvas.width/2;
                ballY = canvas.height/2;
                ballSpeedX = -ballSpeedX;
            }
            
            currentGame = setInterval(() => {
                update();
                draw();
            }, 1000/60);
        }
        
        function startMemoryGame() {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            let cards = [];
            let flipped = [];
            let matched = [];
            let score = 0;
            
            // Create 8 pairs
            const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
            cards = [...emojis, ...emojis];
            cards.sort(() => Math.random() - 0.5);
            
            function draw() {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const cardWidth = 80;
                const cardHeight = 80;
                const spacing = 10;
                const startX = (canvas.width - (cardWidth * 4 + spacing * 3)) / 2;
                const startY = 50;
                
                for(let i = 0; i < cards.length; i++) {
                    let row = Math.floor(i / 4);
                    let col = i % 4;
                    let x = startX + col * (cardWidth + spacing);
                    let y = startY + row * (cardHeight + spacing);
                    
                    ctx.fillStyle = '#333';
                    ctx.fillRect(x, y, cardWidth, cardHeight);
                    
                    if(flipped.includes(i) || matched.includes(i)) {
                        ctx.font = '40px Arial';
                        ctx.fillStyle = '#fff';
                        ctx.fillText(cards[i], x + 20, y + 55);
                    }
                }
            }
            
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                const cardWidth = 80;
                const cardHeight = 80;
                const spacing = 10;
                const startX = (canvas.width - (cardWidth * 4 + spacing * 3)) / 2;
                const startY = 50;
                
                for(let i = 0; i < cards.length; i++) {
                    let row = Math.floor(i / 4);
                    let col = i % 4;
                    let x = startX + col * (cardWidth + spacing);
                    let y = startY + row * (cardHeight + spacing);
                    
                    if(clickX > x && clickX < x + cardWidth && clickY > y && clickY < y + cardHeight) {
                        if(!flipped.includes(i) && !matched.includes(i) && flipped.length < 2) {
                            flipped.push(i);
                            draw();
                            
                            if(flipped.length === 2) {
                                setTimeout(() => {
                                    if(cards[flipped[0]] === cards[flipped[1]]) {
                                        matched.push(...flipped);
                                        score += 10;
                                        document.getElementById('score').innerText = score;
                                    }
                                    flipped = [];
                                    draw();
                                    
                                    if(matched.length === cards.length) {
                                        alert(`You won! Score: ${score}`);
                                        closeGame();
                                    }
                                }, 1000);
                            }
                        }
                    }
                }
            });
            
            draw();
            currentGame = setInterval(draw, 30);
        }
        
        function closeGame() {
            if(currentGame) clearInterval(currentGame);
            document.getElementById('game-container').style.display = 'none';
            document.querySelector('.games-grid').style.display = 'grid';
        }
        
        function restartGame() {
            closeGame();
            playGame(currentGameType);
        }
    </script>
</body>
</html>
